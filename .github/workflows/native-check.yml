name: Native WebView validation

on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        default: windows-latest
        options: [windows-latest, macos-latest]

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python packaging/check_native.py
